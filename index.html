    <!--
      Il poster dell'hero è l'elemento LCP: parte insieme all'HTML, non dopo il JS.
      I due pesi del titolo evitano il salto tipografico sopra la piega.
    -->
    <link rel="preload" as="image" href="/hero-poster.webp" media="(min-width: 601px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-poster-mobile.webp" media="(max-width: 600px)" fetchpriority="high" />
    <!-- Copre più superficie del poster, quindi è lui l'elemento LCP: senza
         preload il browser lo scopre solo dopo aver letto il CSS. -->
    <link rel="preload" as="image" href="/herobg.webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-900.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400.woff2" crossorigin />

    <!--
      CSS critico in linea. Dipinge il fondo e posiziona il poster d'avvio prima
      che arrivi qualsiasi foglio di stile, così non c'è né lampo bianco né salto
      di layout. La geometria replica quella di .hero-stage in src/index.css.
    -->
    <style>
      html { background-color: #050816; }
      body { margin: 0; background-color: #050816; position: relative; }
      #boot-hero {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 78vh;
        height: 78svh;
        /* Sopra gli sfondi dell'applicazione, sotto il testo dell'hero (z-10)
           e la navbar (z-30). Il canvas 3D si inserisce fra i due, a z-index 3. */
        z-index: 2;
        pointer-events: none;
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-hero img {
        width: 100%; height: 100%;
        -o-object-fit: contain;
           object-fit: contain;
        -o-object-position: center bottom;
           object-position: center bottom;
      }
      @media (min-width: 640px) { #boot-hero { height: 96vh; height: 96svh; } }
      @media (min-width: 1024px) { #boot-hero { height: 104vh; height: 104svh; } }
    </style>

    <script type="module" crossorigin src="/assets/index-DfLoC_Ce.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DQNIA0wV.css">
  </head>
  <body>
    <!--
      Il poster dell'hero sta nell'HTML, non dentro l'albero React, e ci resta:
      è l'elemento LCP, e la sua unica dipendenza è il documento stesso. Quando
      il poster viveva dentro React, Lighthouse gli attribuiva anche il download
      e l'esecuzione dei 182 kB del bundle, e l'LCP simulato passava da 2,1 a 4,1
      secondi pur essendo l'immagine già in cache dal preload.

      Hero.jsx non ne disegna una seconda copia: si limita a farlo sfumare quando
      il modello 3D è pronto a sostituirlo.
    -->
    <div id="boot-hero" aria-hidden="true">
      <picture>
        <source media="(max-width: 600px)" srcset="/hero-poster-mobile.webp" width="720" height="720" />
        <img src="/hero-poster.webp" alt="" width="1400" height="1000" fetchpriority="high" decoding="async" />
      </picture>
    </div>

        </p>
      </div>
    </noscript>
  </body>
